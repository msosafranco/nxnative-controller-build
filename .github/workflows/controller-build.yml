{
  "name": "Free iPad controller runtime",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "paths": [
        ".github/workflows/controller-build.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "controller-runtime",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "if": "${{ github.event.repository.private == false }}",
      "runs-on": "macos-26",
      "timeout-minutes": 45,
      "env": {
        "HOMEBREW_NO_AUTO_UPDATE": "1",
        "PYTHONUTF8": "1"
      },
      "steps": [
        {
          "name": "Check out the original shell overlay",
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "xinerqu/ns2ios-shell",
            "ref": "59492c868416d82cdd5b57fbbf78753d044412d9",
            "path": "fork",
            "persist-credentials": false
          }
        },
        {
          "name": "Check out the exact working runtime base",
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "seedds/nxnative",
            "ref": "337186cf3ce778dd1b89092e8958652cb4d7ceb3",
            "path": "runtime",
            "persist-credentials": false
          }
        },
        {
          "name": "Assemble the same source as the working shell",
          "shell": "python",
          "run": "from pathlib import Path\nimport shutil,subprocess\nfork=Path('fork').resolve(); runtime=Path('runtime').resolve()\nfor line in (fork/'.shell-overlay.txt').read_text().splitlines():\n    if not line.startswith('+'): continue\n    name=line[1:].split('#')[0].strip()\n    if not name: continue\n    src=fork/name; dst=runtime/name\n    assert dst.resolve().is_relative_to(runtime)\n    dst.parent.mkdir(parents=True,exist_ok=True)\n    if src.is_dir(): shutil.copytree(src,dst,dirs_exist_ok=True)\n    else: shutil.copy2(src,dst)\nfor patch in sorted((fork/'.shell-patches').glob('*.patch')):\n    subprocess.run(['git','apply',str(patch)],cwd=runtime,check=True)\nprint('Assembled the exact 337186c + 59492c8 working-shell base.')\n"
        },
        {
          "name": "Apply verified controller sources",
          "shell": "python",
          "run": "import base64,hashlib,io,zipfile\nfrom pathlib import Path\npayload=base64.b64decode('')\nassert hashlib.sha256(payload).hexdigest()=='adea62282b0cc3e4892743410284ec66f7f44a413a8b9e4e81345e66929385b3'\nallowed=set(['dm/host/pad_session.h', 'dm/host/tests/t_pad_session.c', 'dm/host/tests/Makefile', 'dm/ios/Sources/DmGamepad.m', 'dm/ios/Sources/front_ios.m', 'dm/games/settings.tsv', 'dm/tools/tests/test_launcher_settings.py'])\nwith zipfile.ZipFile(io.BytesIO(payload)) as z:\n    assert set(z.namelist())==allowed\n    for name in z.namelist():\n        target=Path('runtime')/name\n        assert target.resolve().is_relative_to(Path('runtime').resolve())\n        target.parent.mkdir(parents=True,exist_ok=True)\n        if name=='dm/ios/Sources/front_ios.m':\n            text=target.read_text()\n            assert text.count('void dm_gamepad_reset(void);')==1\n            text=text.replace('void dm_gamepad_reset(void);','void dm_gamepad_reset(void);'+chr(10)+'void dm_gamepad_active(void);')\n            lines=text.splitlines(True)\n            for i,line in enumerate(lines):\n                if '        case 3:   // Becoming active again' in line:\n                    lines.insert(i+1,'            dm_gamepad_active();'+chr(10)); break\n            else: raise AssertionError('No scene activation hook')\n            target.write_text(''.join(lines))\n        elif name=='dm/tools/tests/test_launcher_settings.py':\n            text=target.read_text(); old=\"{'DM_SHOW_FPS', 'DM_TOUCH_HAPTICS'}\"\n            assert text.count(old)==1\n            target.write_text(text.replace(old,\"{'DM_SHOW_FPS', 'DM_TOUCH_HAPTICS', 'DM_TOUCH_PLAYER'}\"))\n        elif name=='dm/host/tests/Makefile':\n            extra=['run: $(B)/t_pad_session','$(B)/t_pad_session: t_pad_session.c ../pad_session.h ../pad_slots.h ../dm_input.h ../motion_fusion.h | $(B)',chr(9)+'$(CLANG) -std=gnu11 -O2 -Wall -Wextra -Werror -pedantic -I.. -o $@ t_pad_session.c']\n            target.write_text(target.read_text()+chr(10)+chr(10).join(extra)+chr(10))\n        else:\n            target.write_bytes(z.read(name))\nprint('Applied verified controller sources; no game files or keys included.')\n"
        },
        {
          "name": "Check Xcode and install build dependencies",
          "run": "set -euo pipefail\nSDK=$(xcrun --sdk iphoneos --show-sdk-version)\necho \"iOS SDK: $SDK\"\ntest \"${SDK%%.*}\" -ge 26\nbrew list xcodegen >/dev/null 2>&1 || brew install xcodegen\npython3 -m venv \"$RUNNER_TEMP/controller-venv\"\n\"$RUNNER_TEMP/controller-venv/bin/python\" -m pip install fonttools\necho \"$RUNNER_TEMP/controller-venv/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Run controller and launcher tests",
          "run": "set -euo pipefail\ncd runtime\nmkdir -p \"$RUNNER_TEMP/controller-tests\"\nclang -std=gnu11 -O2 -Wall -Wextra -Werror -pedantic dm/host/tests/t_pad_session.c -o \"$RUNNER_TEMP/controller-tests/routes\"\n\"$RUNNER_TEMP/controller-tests/routes\"\npython3 dm/tools/tests/test_launcher_settings.py\n"
        },
        {
          "name": "Compile the unsigned iPhone and iPad runtime",
          "env": {
            "DM_ROOT": "${{ runner.temp }}/controller-runtime"
          },
          "run": "set -euo pipefail\ncd runtime\nbash dm/ios/tools/shell_build.sh\nmkdir -p \"$GITHUB_WORKSPACE/result\"\ncp \"$DM_ROOT/build/shell/nxnative-shell-build-input.zip\" \"$GITHUB_WORKSPACE/result/controller-shell.zip\"\npython3 - <<'PY'\nimport hashlib,json,os,zipfile\nfrom pathlib import Path\np=Path(os.environ['GITHUB_WORKSPACE'])/'result/controller-shell.zip'\nwith zipfile.ZipFile(p) as z:\n    assert z.testzip() is None\n    host=z.read('Payload/DmIOS.app/DmIOS')\n    assert b'DM_TOUCH_PLAYER' in host\n    assert b'_dm_pad_set_player' in host\n    assert b'_dm_pad_players' in host\n    assert not any(n.endswith(('.nsp','.xci','.keys','.nca','.tik')) for n in z.namelist())\n    assert not any('/Guest.framework/' in n or '/romfs/' in n or '/msl/' in n for n in z.namelist())\nreport={'upstream_base':'337186cf3ce778dd1b89092e8958652cb4d7ceb3','source_base':'59492c868416d82cdd5b57fbbf78753d044412d9','controller_payload_sha256':'adea62282b0cc3e4892743410284ec66f7f44a413a8b9e4e81345e66929385b3','shell_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'unsigned':True,'game_content':False,'compiled_multiplayer_symbols_checked':True,'ipad_gameplay_test':'pending'}\n(p.parent/'Verification.json').write_text(json.dumps(report,indent=2))\nPY\n"
        },
        {
          "name": "Save the runtime for local packing",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "controller-shell",
            "path": "result/*",
            "if-no-files-found": "error",
            "retention-days": 1,
            "compression-level": 0
          }
        },
        {
          "name": "Save diagnostics if compilation fails",
          "if": "failure()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "controller-build-diagnostics",
            "path": "${{ runner.temp }}/controller-runtime/build/shell/*.log",
            "if-no-files-found": "ignore",
            "retention-days": 1
          }
        }
      ]
    }
  }
}
